<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>會議簽到</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{--paper:#F4F5F8;--surface:#fff;--ink:#1B2333;--muted:#5D6779;--line:#D6DCE5;--accent:#23457A;--accent-soft:#E6ECF6;--seal:#C0392B;--seal-soft:#F7E4E0;
  --f-display:"Noto Serif TC","PMingLiU",serif;--f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.head{background:var(--surface);border-bottom:1px solid var(--line)}
.head .wrap{padding-bottom:16px;gap:4px}
.eyebrow{color:var(--seal);font-weight:700;letter-spacing:.18em;font-size:.8rem}
h1{font-family:var(--f-display);font-weight:900;font-size:1.4rem;line-height:1.35;margin:0}
.where{color:var(--muted);font-size:.9rem}
input[type=search],.fld input{width:100%;padding:12px 14px;border:1px solid #AEB8C7;border-radius:8px;background:var(--surface);font-size:1rem}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-top:1px solid var(--line);background:none;padding:14px 16px;text-align:left;cursor:pointer;width:100%}
.list button:first-child{border-top:0}
.list button:active{background:var(--accent-soft)}
.nm{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.06em}
.un{color:var(--muted);font-size:.85rem}
.go{color:var(--accent);font-size:.9rem;white-space:nowrap}
.btn{border:1px solid #AEB8C7;background:var(--surface);border-radius:8px;padding:12px 16px;cursor:pointer;font-weight:500}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:700}
.btn.link{border:0;background:none;color:var(--accent);text-decoration:underline;padding:6px 0;align-self:center}
.row{display:flex;gap:10px}.row .btn{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pad{position:relative;border:1px solid #AEB8C7;border-radius:8px;background:#fff;touch-action:none}
.pad canvas{display:block;width:100%;height:200px}
.pad .ph{position:absolute;inset:auto 0 12px;text-align:center;color:#9AA3B1;font-size:.85rem;pointer-events:none}
.note{color:var(--muted);font-size:.82rem;margin:0}
.lock{display:inline-flex;gap:6px;align-items:center;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:6px 10px;font-size:.82rem}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.done{text-align:center;align-items:center;padding:32px 16px}
.stamp{border:3px solid var(--seal);color:var(--seal);border-radius:6px;padding:8px 22px;transform:rotate(-6deg);background:var(--seal-soft);display:inline-block}
.stamp b{display:block;font-family:var(--f-display);font-weight:900;font-size:1.6rem;letter-spacing:.3em}
.err{color:var(--seal)}
.item{display:flex;flex-direction:column;gap:10px}
.item .no{font-family:var(--f-display);font-weight:900;color:var(--accent)}
.fld textarea{width:100%;min-height:5.5em;padding:10px 12px;border:1px solid #AEB8C7;border-radius:8px;background:#fff;font:inherit;font-size:1rem;resize:vertical}
.fld .lab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mic{border:1px solid #AEB8C7;background:#fff;border-radius:999px;padding:4px 12px;font-size:.9rem;cursor:pointer}
.mic.on{background:var(--seal);border-color:var(--seal);color:#fff}
.bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;justify-content:space-between}
.bar .st{font-size:.85rem;color:var(--muted)}
.mine{background:var(--seal-soft);color:var(--seal);border-radius:8px;padding:10px 14px;font-size:.9rem}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js"></script>
</head><body>
<div class="head"><div class="wrap"><div class="eyebrow">會議簽到</div><h1 id="title">讀取中…</h1><div class="where" id="where"></div></div></div>
<div class="wrap" id="app"><div class="card"><p class="note">正在讀取會議名單…</p></div></div>
<script>
/* ===== 共用：加密（node-forge）與 Firestore REST ===== */
var COL_R = 'mt_roster', COL_C = 'mt_checkin', COL_D = 'mt_mdraft', COL_M = 'mt_minutes';
var CR = {
  hex2bytes: function (h) { return forge.util.hexToBytes(h); },
  randHex: function (n) { return forge.util.bytesToHex(forge.random.getBytesSync(n)); },
  aesEnc: function (key, obj) {
    var iv = forge.random.getBytesSync(12), c = forge.cipher.createCipher('AES-GCM', key);
    c.start({ iv: iv }); c.update(forge.util.createBuffer(forge.util.encodeUtf8(JSON.stringify(obj)))); c.finish();
    return { iv: forge.util.encode64(iv), ct: forge.util.encode64(c.output.getBytes() + c.mode.tag.getBytes()) };
  },
  aesDec: function (key, e) {
    var raw = forge.util.decode64(e.ct), tag = raw.slice(-16), body = raw.slice(0, -16);
    var d = forge.cipher.createDecipher('AES-GCM', key);
    d.start({ iv: forge.util.decode64(e.iv), tag: forge.util.createBuffer(tag) }); d.update(forge.util.createBuffer(body));
    if (!d.finish()) throw new Error('解密失敗：金鑰不符或資料遭竄改');
    return JSON.parse(forge.util.decodeUtf8(d.output.getBytes()));
  },
  OAEP: function () { return { md: forge.md.sha256.create(), mgf1: { md: forge.md.sha256.create() } }; },
  sealFor: function (pubPem, obj) {
    var k = forge.random.getBytesSync(32), e = CR.aesEnc(k, obj);
    var pub = forge.pki.publicKeyFromPem(pubPem);
    e.wk = forge.util.encode64(pub.encrypt(k, 'RSA-OAEP', CR.OAEP()));
    return e;
  },
  unseal: function (priv, e) {
    var k = priv.decrypt(forge.util.decode64(e.wk), 'RSA-OAEP', CR.OAEP());
    return CR.aesDec(k, e);
  },
  proof: function (tok, mid) { var md = forge.md.sha256.create(); md.update(String(tok).toUpperCase() + '|' + mid, 'utf8'); return md.digest().toHex(); },
  genRSA: function () {
    var sub = window.crypto && window.crypto.subtle;
    var pem = function (buf, label) { var b = forge.util.encode64(String.fromCharCode.apply(null, new Uint8Array(buf))).match(/.{1,64}/g).join('\n'); return '-----BEGIN ' + label + '-----\n' + b + '\n-----END ' + label + '-----'; };
    if (sub) return sub.generateKey({ name:'RSA-OAEP', modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256' }, true, ['encrypt','decrypt'])
      .then(function (kp) { return Promise.all([sub.exportKey('spki', kp.publicKey), sub.exportKey('pkcs8', kp.privateKey)]); })
      .then(function (r) { return { pub: pem(r[0], 'PUBLIC KEY'), priv: pem(r[1], 'PRIVATE KEY') }; })
      .catch(function () { return CR.genRSAforge(); });
    return CR.genRSAforge();
  },
  genRSAforge: function () {
    return new Promise(function (ok, no) {
      forge.pki.rsa.generateKeyPair({ bits: 2048, e: 0x10001 }, function (err, kp) {
        if (err) return no(err);
        ok({ pub: forge.pki.publicKeyToPem(kp.publicKey), priv: forge.pki.privateKeyToPem(kp.privateKey) });
      });
    });
  }
};
var FS = {
  base: function (p) { return 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(p) + '/databases/(default)/documents'; },
  toF: function (o) { var f = {}; Object.keys(o).forEach(function (k) { var v = o[k]; f[k] = typeof v === 'number' ? { integerValue: String(Math.round(v)) } : { stringValue: String(v) }; }); return f; },
  fromF: function (f) { var o = {}; Object.keys(f || {}).forEach(function (k) { var v = f[k]; o[k] = 'integerValue' in v ? Number(v.integerValue) : 'stringValue' in v ? v.stringValue : null; }); return o; },
  err: function (r) { return r.text().then(function (t) { var m = t; try { m = JSON.parse(t).error.message; } catch (e) {} throw new Error('雲端回應 ' + r.status + '：' + String(m).slice(0, 160)); }); },
  add: function (p, col, data) {
    return fetch(FS.base(p) + '/' + col, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: FS.toF(data) }) })
      .then(function (r) { return r.ok ? r.json() : FS.err(r); });
  },
  byMeeting: function (p, col, mid) {
    var q = { structuredQuery: { from: [{ collectionId: col }], where: { fieldFilter: { field: { fieldPath: 'm' }, op: 'EQUAL', value: { stringValue: mid } } } } };
    return fetch(FS.base(p) + ':runQuery', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(q) })
      .then(function (r) { return r.ok ? r.json() : FS.err(r); })
      .then(function (a) { return (a || []).filter(function (x) { return x.document; }).map(function (x) { var o = FS.fromF(x.document.fields); o._id = x.document.name.split('/').pop(); return o; }); });
  }
};

/* ===== 語音轉文字（Chrome / Edge / Android Chrome / iOS Safari） ===== */
var MIC = {
  cur: null,
  ok: function () { return !!(window.SpeechRecognition || window.webkitSpeechRecognition) && window.isSecureContext !== false; },
  toggle: function (btn, target, onState) {
    if (MIC.cur) { var same = MIC.cur.btn === btn; MIC.stop(); if (same) return; }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { if (onState) onState('unsupported'); return; }
    var r = new SR(), base = target.value, fin = '';
    r.lang = 'zh-TW'; r.continuous = true; r.interimResults = true;
    var put = function (s) { target.value = s; target.dispatchEvent(new Event('input', { bubbles: true })); };
    r.onresult = function (e) {
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) { var t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t; else interim += t; }
      put(base + fin + interim);
    };
    r.onerror = function (e) { if (e.error === 'no-speech' || e.error === 'aborted') return; if (MIC.cur && MIC.cur.r === r) MIC.cur.want = false; if (onState) onState('error', e.error); };
    r.onend = function () {
      if (!MIC.cur || MIC.cur.r !== r) return;
      if (MIC.cur.want) { base = base + fin; fin = ''; try { r.start(); return; } catch (x) {} }
      put(base + fin); btn.classList.remove('on'); MIC.cur = null; if (onState) onState('stop');
    };
    MIC.cur = { r: r, btn: btn, want: true }; btn.classList.add('on');
    try { r.start(); if (onState) onState('start'); } catch (x) { MIC.cur = null; btn.classList.remove('on'); if (onState) onState('error', x.message); }
  },
  stop: function () { if (!MIC.cur) return; MIC.cur.want = false; try { MIC.cur.r.stop(); } catch (e) {} },
  msg: function (state, err) {
    if (state === 'unsupported') return '這個瀏覽器不支援語音輸入，請改用 Chrome，或用手機鍵盤上的麥克風輸入。';
    if (state === 'error') return err === 'not-allowed' || err === 'service-not-allowed' ? '麥克風權限被拒絕，請在網址列允許使用麥克風。' : err === 'network' ? '語音轉文字需要連上網路。' : '語音輸入中斷（' + err + '）';
    return '';
  }
};

(function(){
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var hhmm = function(t){ var d = new Date(t), p = function(n){ return String(n).padStart(2,'0'); }; return p(d.getHours()) + ':' + p(d.getMinutes()); };
function ls(k, v){ try { if (v === undefined) { var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
var DEF_PROJECT = 'meeting-sign-2781e';
var raw = (location.hash || '').slice(1), MK = null;
function toks(){ return ls('ms.tok') || []; }
function tokFor(name){ var t = toks().find(function(x){ return x.name === name || (x.name && name && (x.name.indexOf(name) === 0 || name.indexOf(x.name) === 0)); }); return t ? t.tok : null; }
function addTok(name, tok){ var L = toks().filter(function(x){ return x.name !== name; }); L.push({ name:name, tok:String(tok).toUpperCase(), at:Date.now() }); return ls('ms.tok', L) !== null || toks().length; }
var bm = raw.match(/^s\.([0-9A-Za-z]{12})\.(.+)$/);
if (bm) {
  var bname = ''; try { bname = decodeURIComponent(bm[2]); } catch(e){ bname = bm[2]; }
  var ok0 = addTok(bname, bm[1]);
  $('#title').textContent = '電子印章 QR 簽到卡';
  document.querySelector('.eyebrow').textContent = '電子印章登錄';
  $('#app').innerHTML = !ok0 ? '<div class="card"><p class="err">這支手機的瀏覽器不允許儲存資料（可能是無痕模式），無法完成登錄。請改用一般模式開啟。</p></div>'
    : '<div class="card done"><div class="stamp"><b>已登錄</b></div><div class="nm" style="font-size:1.4rem">' + esc(bname) + '</div><p class="note">這支手機已登錄你的電子印章 QR 簽到卡。之後開會掃會議簽到 QR Code、點自己的名字，就可以「蓋我的電子印章」。</p><p class="note err">請只在本人的手機上掃描，卡片請妥善保管。</p></div>';
  try { history.replaceState(null, '', location.pathname); } catch(e){}
  return;
}
if (raw.indexOf('~') >= 0) { MK = raw.split('~')[1]; raw = raw.split('~')[0]; }
var h = raw.split('.'), MID = h[0], K = h[1], PROJECT = h[2] || DEF_PROJECT;
var D = null, q = '';
function fail(msg){ $('#title').textContent = '無法開啟簽到'; $('#app').innerHTML = '<div class="card"><p class="err">' + esc(msg) + '</p><p class="note">請重新掃描會場的 QR 碼，或洽詢會議工作人員。</p></div>'; }
if (!window.forge) return fail('加密元件載入失敗，請確認手機已連上網路後重新整理。');
if (!/^m[0-9a-f]{16}$/.test(MID || '') || !/^[0-9a-f]{32}$/.test(K || '') || (MK !== null && !/^[0-9a-f]{32}$/.test(MK))) return fail('連結不完整。');

FS.byMeeting(PROJECT, COL_R, MID).then(function(docs){
  if (!docs.length) throw new Error('找不到這場會議的名單，可能主辦人尚未發布。');
  var last = docs.sort(function(a, b){ return b.rev - a.rev; })[0];
  D = CR.aesDec(CR.hex2bytes(K), last);
  $('#title').textContent = D.title || '會議';
  $('#where').textContent = [D.datetime, D.place].filter(Boolean).join('｜');
  document.title = (MK ? '會議紀錄｜' : '簽到｜') + (D.title || '會議');
  if (MK) minutes(); else list();
}).catch(function(e){ fail(e.message); });

function mine(){ return (ls('ms.signed.' + MID) || []); }
function list(){
  var M = mine();
  $('#app').innerHTML =
    (M.length ? '<div class="mine">這支手機已送出：' + M.map(function(x){ return esc(x.name); }).join('、') + '</div>' : '') +
    (D.people || []).filter(function(p){ return tokFor(p.name); }).map(function(p){ return '<button class="btn seal" data-quick="' + esc(p.sid) + '" style="width:100%">我是 ' + esc(p.name) + '・蓋我的電子印章</button>'; }).join('') +
    '<input type="search" id="q" placeholder="輸入姓名搜尋" aria-label="搜尋姓名" autocomplete="off">' +
    '<div class="list" id="list"></div>' +
    '<button class="btn link" id="walk">名單上找不到我（現場加簽）</button>' +
    '<span class="lock">🔒 簽名會在這支手機上加密後才送出，只有主辦人能解開</span>';
  $('#q').value = q;
  $('#q').addEventListener('input', function(e){ q = e.target.value; draw(); });
  $('#walk').onclick = function(){ sign(null); };
  document.querySelectorAll('[data-quick]').forEach(function(b){ b.onclick = function(){ var p = D.people.find(function(x){ return x.sid === b.dataset.quick; }); if (p) stampSign(p, b); }; });
  draw();
}
function draw(){
  var qq = q.trim().toLowerCase();
  var L = (D.people || []).filter(function(p){ return !qq || (p.name + p.unit).toLowerCase().indexOf(qq) >= 0; });
  $('#list').innerHTML = L.length ? L.map(function(p){ return '<button data-sid="' + esc(p.sid) + '"><span><div class="nm">' + esc(p.name) + '</div><div class="un">' + esc(p.unit) + '</div></span><span class="go">簽到 ›</span></button>'; }).join('') : '<p class="note" style="padding:14px 16px">找不到「' + esc(q) + '」，可按下方「名單上找不到我」現場加簽。</p>';
  document.querySelectorAll('#list button').forEach(function(b){ b.onclick = function(){ sign(D.people.find(function(p){ return p.sid === b.dataset.sid; })); }; });
}
function sign(p){
  window.scrollTo(0, 0);
  $('#app').innerHTML = '<div class="card">' +
    (p ? '<div><div class="nm" style="font-size:1.5rem">' + esc(p.name) + '</div><div class="un">' + esc(p.unit) + '</div></div>'
       : '<label class="fld">姓名<input id="wName" autocomplete="name"></label><label class="fld">單位／職稱<input id="wUnit"></label>') +
    (p ? (tokFor(p.name)
      ? '<button class="btn seal" id="useSt" style="width:100%">🔴 蓋我的電子印章</button><p class="note" style="text-align:center;margin:0">或在下方手寫簽名</p>'
      : '<details class="note" id="stReg"><summary style="cursor:pointer;color:var(--accent)">我有電子印章 QR 簽到卡</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><span>請輸入卡片上的 12 碼代碼（或先用手機相機掃描卡片完成登錄，再回到這裡）：</span><input id="stCode" maxlength="15" autocapitalize="characters" autocomplete="off" placeholder="例如 AB12 CD34 EF56" style="padding:12px 14px;border:1px solid #AEB8C7;border-radius:8px;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase"><button class="btn seal" id="stCodeGo">登錄並蓋章簽到</button></div></details>') : '') +
    '<div class="pad"><canvas id="cv"></canvas><div class="ph" id="ph">請用手指在框內簽名</div></div>' +
    '<p class="note err" id="msg"></p>' +
    '<div class="row"><button class="btn" id="back">返回</button><button class="btn" id="clr">清除</button><button class="btn seal" id="ok">確認簽到</button></div></div>';
  var cv = $('#cv'), ctx = cv.getContext('2d'), drawn = false, drawing = false;
  requestAnimationFrame(function(){ var r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d,0,0,d,0,0); ctx.lineWidth = 2.6; ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = '#141B29'; });
  var pt = function(e){ var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', function(e){ drawing = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); var a = pt(e); ctx.moveTo(a[0], a[1]); e.preventDefault(); });
  cv.addEventListener('pointermove', function(e){ if (!drawing) return; var a = pt(e); ctx.lineTo(a[0], a[1]); ctx.stroke(); drawn = true; $('#ph').hidden = true; });
  ['pointerup','pointercancel'].forEach(function(t){ cv.addEventListener(t, function(){ drawing = false; }); });
  $('#clr').onclick = function(){ ctx.clearRect(0, 0, cv.width, cv.height); drawn = false; $('#ph').hidden = false; };
  $('#back').onclick = list;
  if ($('#useSt')) $('#useSt').onclick = function(){ stampSign(p, this); };
  if ($('#stCodeGo')) $('#stCodeGo').onclick = function(){ var c = $('#stCode').value.replace(/[\s-]/g, '').toUpperCase(); if (!/^[0-9A-Z]{12}$/.test(c)) { $('#msg').textContent = '代碼是 12 個英數字，請再確認。'; return; } addTok(p.name, c); stampSign(p, this); };
  $('#ok').onclick = function(){
    var name = p ? p.name : $('#wName').value.trim(), unit = p ? p.unit : $('#wUnit').value.trim();
    if (!name) { $('#msg').textContent = '請輸入姓名'; return $('#wName').focus(); }
    if (!drawn) { $('#msg').textContent = '請先簽名'; return; }
    var o = document.createElement('canvas'); o.width = 320; o.height = Math.round(320 * cv.height / cv.width);
    var c2 = o.getContext('2d'); c2.fillStyle = '#fff'; c2.fillRect(0, 0, o.width, o.height); c2.drawImage(cv, 0, 0, o.width, o.height);
    var at = Date.now(), payload = { sid:p ? p.sid : null, name:name, unit:unit, sig:o.toDataURL('image/jpeg', .6), at:at };
    submit(payload, name, $('#ok'), '確認簽到');
  };
}
function stampSign(p, btn){
  var tok = tokFor(p.name); if (!tok) return;
  submit({ sid:p.sid, name:p.name, unit:p.unit, stamp:CR.proof(tok, MID), at:Date.now() }, p.name, btn, btn.textContent, true);
}
function submit(payload, name, btn, label, isStamp){
  btn.disabled = true; btn.textContent = '加密送出中…'; var msg = $('#msg'); if (msg) msg.textContent = '';
  var e;
  try { e = CR.sealFor(D.pub, payload); } catch(err){ btn.disabled = false; btn.textContent = label; if (msg) msg.textContent = '加密失敗：' + err.message; return; }
  FS.add(PROJECT, COL_C, { m:MID, iv:e.iv, wk:e.wk, ct:e.ct, t:payload.at }).then(function(){
    var M = mine(); M.push({ name:name, at:payload.at }); ls('ms.signed.' + MID, M);
    window.scrollTo(0, 0);
    $('#app').innerHTML = '<div class="card done"><div class="stamp"><b>' + (isStamp ? '已蓋章' : '已簽到') + '</b></div><div class="nm" style="font-size:1.4rem">' + esc(name) + '</div><p class="note">' + (isStamp ? '已送出電子印章簽到，主辦端驗證後會帶入你的印章。' : '簽到資料已加密送出，謝謝。') + '可以關閉這個頁面。</p><button class="btn link" id="again">幫其他人簽到</button></div>';
    $('#again').onclick = function(){ q = ''; list(); };
  }).catch(function(err){ btn.disabled = false; btn.textContent = '重新送出'; if (msg) msg.textContent = '送出失敗（' + err.message + '），請確認網路後再按一次。'; });
}

/* ===== 手機填寫會議紀録 ===== */
var MD = { items:[], notes:'' }, drev = 0, dirty = {}, notesDirty = false, sendTimer = null, sending = false, lastSent = 0;
var CN = ['','一','二','三','四','五','六','七','八','九','十'];
var cnNum = function(n){ return n<=10?CN[n]:n<20?'十'+CN[n-10]:CN[Math.floor(n/10)]+'十'+CN[n%10]; };
var FLD = [['discussion','說明／討論','ta'],['decision','決議','ta'],['owner','負責單位／人','in'],['due','完成期限','in']];
function loadDraft(){
  return FS.byMeeting(PROJECT, COL_D, MID).then(function(docs){
    if (!docs.length) return false;
    var last = docs.sort(function(a, b){ return b.rev - a.rev; })[0];
    if (last.rev <= drev) return false;
    var o = CR.aesDec(CR.hex2bytes(MK), last); drev = last.rev; return o;
  });
}
function minutes(){
  document.querySelector('.eyebrow').textContent = '會議紀錄・手機填寫';
  var saved = ls('ms.min.' + MID);
  loadDraft().then(function(o){
    if (o) { MD.items = o.items || []; MD.notes = o.notes || ''; }
    if (saved && saved.dirty) { (saved.items || []).forEach(function(si){ if (!saved.dirty[si.id]) return; var it = MD.items.find(function(x){ return x.id === si.id; }); if (it) Object.assign(it, si); else MD.items.push(si); dirty[si.id] = true; }); if (saved.notesDirty) { MD.notes = saved.notes; notesDirty = true; } }
    drawMinutes(); if (Object.keys(dirty).length || notesDirty) queueSend();
    setInterval(refresh, 15000);
  }).catch(function(e){ fail('讀取會議紀錄失敗：' + e.message); });
}
function fieldHtml(id, k, label, kind, v){
  var mic = '<button type="button" class="mic" data-mic>🎤 語音</button>';
  return '<label class="fld"><span class="lab"><span>' + label + '</span>' + (kind === 'ta' ? mic : '') + '</span>' +
    (kind === 'ta' ? '<textarea data-id="' + esc(id) + '" data-k="' + k + '">' + esc(v) + '</textarea>' : '<input data-id="' + esc(id) + '" data-k="' + k + '" value="' + esc(v) + '">') + '</label>';
}
function drawMinutes(){
  $('#app').innerHTML = MD.items.map(function(it, n){
    return '<div class="card item" data-item="' + esc(it.id) + '"><div class="row" style="align-items:center"><span class="no">' + cnNum(n + 1) + '、</span><input style="flex:1;font-weight:700" data-id="' + esc(it.id) + '" data-k="topic" value="' + esc(it.topic) + '" placeholder="案由"></div>' +
      FLD.map(function(f){ return fieldHtml(it.id, f[0], f[1], f[2], it[f[0]] || ''); }).join('') + '</div>';
  }).join('') +
    '<button class="btn" id="addIt">＋ 新增議題（臨時動議）</button>' +
    '<div class="card">' + fieldHtml('__notes', 'notes', '其他／備註', 'ta', MD.notes) + '</div>' +
    '<span class="lock">🔒 內容會在這支手機上加密後才送出，只有主辦人能解開</span>';
  if (!$('#bar')) { var b = document.createElement('div'); b.className = 'bar'; b.id = 'bar'; b.innerHTML = '<span class="st" id="st">輸入後會自動送出</span><button class="btn seal" id="sendNow">立即送出</button>'; document.body.appendChild(b); $('#sendNow').onclick = function(){ send(); }; }
  $('#addIt').onclick = function(){ var it = { id:'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), topic:'臨時動議', discussion:'', decision:'', owner:'', due:'' }; MD.items.push(it); dirty[it.id] = true; persist(); drawMinutes(); queueSend(); var el = document.querySelector('[data-item="' + it.id + '"] input'); if (el) { el.focus(); el.select(); } };
  status();
}
document.addEventListener('input', function(e){
  var el = e.target; if (!MK || !el.dataset || !el.dataset.k) return;
  if (el.dataset.id === '__notes') { MD.notes = el.value; notesDirty = true; }
  else { var it = MD.items.find(function(x){ return x.id === el.dataset.id; }); if (!it) return; it[el.dataset.k] = el.value; dirty[it.id] = true; }
  persist(); queueSend();
});
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('[data-mic]'); if (!b || !MK) return; e.preventDefault();
  var ta = b.closest('label').querySelector('textarea');
  MIC.toggle(b, ta, function(st, err){ var m = MIC.msg(st, err); if (m) $('#st').textContent = m; else if (st === 'start') { b.textContent = '■ 停止'; $('#st').textContent = '正在聽…說完請按「停止」'; } else if (st === 'stop') { b.textContent = '🎤 語音'; queueSend(); } });
});
function persist(){ ls('ms.min.' + MID, { items:MD.items, notes:MD.notes, dirty:dirty, notesDirty:notesDirty }); }
function queueSend(){ clearTimeout(sendTimer); sendTimer = setTimeout(send, 2500); status(); }
function status(){ var n = Object.keys(dirty).length + (notesDirty ? 1 : 0), st = $('#st'); if (!st) return; st.textContent = sending ? '加密送出中…' : n ? '有 ' + n + ' 項尚未送出' : lastSent ? '已送出 ' + hhmm(lastSent) : '輸入後會自動送出'; }
function send(){
  clearTimeout(sendTimer);
  if (sending) { queueSend(); return; }
  var ids = Object.keys(dirty); if (!ids.length && !notesDirty) { status(); return; }
  var payload = { mk:MK, items:MD.items.filter(function(it){ return dirty[it.id]; }), at:Date.now() };
  if (notesDirty) payload.notes = MD.notes;
  var e; try { e = CR.sealFor(D.pub, payload); } catch(err){ $('#st').textContent = '加密失敗：' + err.message; return; }
  var snapD = dirty, snapN = notesDirty; dirty = {}; notesDirty = false; sending = true; status();
  FS.add(PROJECT, COL_M, { m:MID, iv:e.iv, wk:e.wk, ct:e.ct, t:Date.now() }).then(function(){ sending = false; lastSent = Date.now(); persist(); status(); })
    .catch(function(err){ sending = false; Object.keys(snapD).forEach(function(k){ dirty[k] = true; }); notesDirty = notesDirty || snapN; persist(); $('#st').textContent = '送出失敗，稍後自動重試（' + err.message + '）'; sendTimer = setTimeout(send, 8000); });
}
function refresh(){
  if (sending) return;
  loadDraft().then(function(o){
    if (!o) return;
    var focus = document.activeElement, added = false;
    (o.items || []).forEach(function(ri){
      var it = MD.items.find(function(x){ return x.id === ri.id; });
      if (!it) { MD.items.push(ri); added = true; return; }
      if (dirty[ri.id]) return;
      ['topic','discussion','decision','owner','due'].forEach(function(k){ it[k] = ri[k] || ''; var el = document.querySelector('[data-id="' + ri.id + '"][data-k="' + k + '"]'); if (el && el !== focus && el.value !== it[k]) el.value = it[k]; });
    });
    if (!notesDirty && typeof o.notes === 'string') { MD.notes = o.notes; var ne = document.querySelector('[data-id="__notes"]'); if (ne && ne !== focus) ne.value = MD.notes; }
    if (added && (!focus || !focus.dataset || !focus.dataset.k)) drawMinutes();
  }).catch(function(){});
}
})();
</script>
</body></html>
